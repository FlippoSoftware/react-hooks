name: Check

on:
    pull_request:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # API Extractor reads the declarations of the build.
            - name: Build
              run: pnpm build

            - name: Lint and public API
              run: pnpm lint:check

            - name: Typecheck
              run: pnpm typecheck
